name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # 由提交历史生成发布说明, 供 Release 正文使用
  # The release notes are generated from the commit history and used as the Release body
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate release notes
        run: |
          npx auto-changelog-plus --starting-version ${{ github.ref_name }}
          sed -i '1,4d' CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  # 发布前必须通过格式检查、静态检查、测试与竞态测试，未通过则不构建任何产物
  # A release must pass format checks, static analysis, tests and race tests; otherwise no artifact is built
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Format check
        shell: bash
        working-directory: src
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        shell: bash
        working-directory: src
        run: go vet ./...

      - name: Test
        shell: bash
        working-directory: src
        run: go test ./...

      - name: Test (race)
        shell: bash
        working-directory: src
        run: go test -race ./...

      # 发布前的漏洞门禁：govulncheck 按 OSV 数据库核对实际调用到的符号，命中即以非零退出码阻断构建
      # 版本固定到 v1.9.0，因为 @latest 会让同一次发版在不同日子得到不同结论，失败时无法复现
      # The pre-release vulnerability gate: govulncheck matches the symbols the build actually calls against the OSV database, and a hit exits non-zero so the artifacts are never built
      # The version is pinned to v1.9.0, because @latest would let the same release conclude differently on different days and leave a failure unreproducible
      - name: govulncheck
        working-directory: src
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    runs-on: ${{ matrix.os }}
    needs: [changelog, test]
    if: always() && needs.test.result == 'success' && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Windows =====
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: .exe

          # ===== Linux =====
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: "7"
            platform: linux-armv7
            ext: ""

          # ===== macOS =====
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build
        shell: bash
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          [ -n "${{ matrix.goarm }}" ] && export GOARM=${{ matrix.goarm }}

          cd src
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/taskpush${{ matrix.ext }} \
            ./cmd/taskpush

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          mv dist/taskpush${{ matrix.ext }} \
             dist/TaskPush-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip ../TaskPush-${{ github.ref_name }}-${{ matrix.platform }}.zip \
            TaskPush-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\TaskPush-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}" `
            -DestinationPath "TaskPush-${{ github.ref_name }}-${{ matrix.platform }}.zip"

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: TaskPush-${{ github.ref_name }}-${{ matrix.platform }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
